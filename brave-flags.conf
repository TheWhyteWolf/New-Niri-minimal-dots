# Brave is Chromium, not Electron: it ignores ELECTRON_OZONE_PLATFORM_HINT.
# It reads this file instead — /usr/bin/brave is a wrapper that turns each
# non-comment line into an argv entry (see also chromium-flags.conf).
#
# Brave does currently default to Wayland on its own, but that is an upstream
# default that has flipped before. Pinning it here keeps Dolphin -> Brave file
# drags working: both ends have to be native Wayland, since xwayland-satellite
# can't bridge drag-and-drop across the boundary. See
# environment.d/50-niri-platform.conf for the whole story.
--ozone-platform-hint=auto
