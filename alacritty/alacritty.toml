[general]
live_config_reload = true
# Colours: theme.toml, generated by `theme` from the palette in use (the deep
# navy and sunset colours that were here are the deep-navy palette).
import = ["~/.config/alacritty/theme.toml"]

[window]
decorations = "None"
padding = { x = 10, y = 10 }
opacity = 0.90

[font]
size = 9

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[bell]
duration = 0

[terminal]
shell = { program = "/usr/bin/fish" }
