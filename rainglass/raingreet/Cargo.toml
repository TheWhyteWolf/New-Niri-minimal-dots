[package]
name = "raingreet"
description = "greetd greeter (under cage): your wallpaper through a rainy window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rainglass = { path = "../rainglass" }
# Pinned with rainlock: app.rs follows LifeBranch's lifegreet, written against
# 0.20.0's xdg window and seat/keyboard repeat semantics.
smithay-client-toolkit = "=0.20.0"
libc = "0.2"
zeroize = "1"
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
