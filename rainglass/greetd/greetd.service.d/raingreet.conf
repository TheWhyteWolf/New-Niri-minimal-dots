# /etc/systemd/system/greetd.service.d/raingreet.conf
#
# LimitMEMLOCK: raingreet pins its memory (password material must not reach
# swap) and only arms that fully with room to spare; systemd's 8 MiB default
# would leave it half-done. StartLimitIntervalSec=0: a login screen must keep
# retrying, never give up into a dead vt1. (From LifeBranch's lifegreet.conf.)
[Unit]
StartLimitIntervalSec=0

[Service]
LimitMEMLOCK=infinity
