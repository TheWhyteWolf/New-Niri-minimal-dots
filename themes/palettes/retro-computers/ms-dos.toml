# The 16 VGA text-mode colours. Apps like EDIT and Norton Commander were blue;
# the prompt itself was black, so the terminal is too.
name    = "MS-DOS"
variant = "dark"
about   = "VGA text mode: white on blue for the desktop, a black DOS prompt in the terminal"

