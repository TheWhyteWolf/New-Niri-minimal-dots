# Fuzzel Configuration - Glassy Dark Theme

[main]
font=DejaVu Sans:weight=bold:size=11
dpi-aware=no
terminal=alacritty -e
prompt="❯ "
icon-theme=Papirus-Dark
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=5
line-height=20
lines=8
letter-spacing=0
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes
# Colours: theme.ini, generated by `theme` from the palette in use.
include=~/.config/fuzzel/theme.ini

# [border]
# width=1
# radius=12

[dmenu]
mode=text  # text | index
exit-immediately-if-empty=no
