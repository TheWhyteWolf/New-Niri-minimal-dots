# Kitty Terminal Configuration

# ────────────────────────────────────────────────────────────────
# COLOURS: theme.conf, generated by `theme` from the palette in use
# (the Glassy Frost colours that were here are the glassy-frost palette).
# globinclude, so a missing file is skipped quietly.
# ────────────────────────────────────────────────────────────────
globinclude theme.conf

cursor_shape          block
cursor_blink_interval 0.5
url_style             curly

# Font configuration
font_family      Fira Code Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.0

# ────────────────────────────────────────────────────────────────
# WINDOW & VISUAL EFFECTS - Glassy Frost Appearance
# ────────────────────────────────────────────────────────────────

# Window layout with glassy effects
remember_window_size      yes
initial_window_width      1200
initial_window_height     800
window_padding_width      20
window_margin_width       0
single_window_margin_width -1

# Glassy frost effects
background_opacity        0.78
background_blur           20
dynamic_background_opacity yes

# Window decorations
hide_window_decorations   titlebar-only
window_border_width       2px
draw_minimal_borders      yes
window_margin_width       2

# Tab bar styling
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       angled
tab_bar_margin_width      0.0
tab_bar_margin_height     0.0 0.0
tab_bar_min_tabs          2
tab_activity_symbol       🔥
tab_title_template        " {index}: {title[title.rfind('/')+1:]} "

# Advanced
shell .
editor .
allow_remote_control no
update_check_interval 0

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Mouse
mouse_hide_wait 3.0
url_style curly
open_url_with default
copy_on_select yes

# Scrollback
scrollback_lines 10000
confirm_os_window_close 0
