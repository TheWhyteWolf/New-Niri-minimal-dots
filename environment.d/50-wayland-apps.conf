# Run Qt and Electron apps as native Wayland clients instead of through
# XWayland: sharp text at fractional scale and working drag-and-drop.
# Read by the systemd user manager at login, so log out fully to apply.
# Brave is Chromium and reads ~/.config/brave-flags.conf instead.
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto
